[workspace]
name = "ml-platform"
version = "2026.3.25"
description = "MaNIAC Lab ML platform environment"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[feature.mlbase]
platforms = ["linux-64"]

[feature.mlbase.dependencies]
# Python
python = "==3.12"
pixi-kernel = "*"

# CERN ROOT
root = "*"

# Java (OpenJDK 8 in ml_base)
openjdk = "*"

# ML frameworks
keras = "*"

# Data science
numpy = "*"
pandas = "*"
scipy = "*"
scikit-learn = "*"
pyarrow = "*"
h5py = "*"
pytables = "*"
cython = "*"

# Visualization
matplotlib = "*"
seaborn = "*"
bokeh = "*"
graphviz = "*"

# Jupyter ecosystem
jupyter = "*"
jupyterlab_server = "*"
jupyterlab = "*"
jupyter_client = ">=8.6.3"

ipykernel = "*"
metakernel = "*"
ipywidgets = "*"
jupyterlab-git = "*"
rise = "*"
jupyter-collaboration = "*"
pycrdt = "*"

# HEP
uproot = "*"

# System tools
curl = "*"
wget = "*"
unzip = "*"
zip = "*"
vim = "*"
jq = "*"
rsync = "*"
git = "*"
make = "*"
compilers = "*"
pkg-config = "*"

# Libraries
freetype = "*"
libpng = "*"
zeromq = "*"
hdf5 = "*"
tbb = "*"
zlib = "*"

# Other
requests = "*"
pillow = "*"
tqdm = "*"
imageio = "*"

[feature.mlbase.pypi-dependencies]
# Packages NOT on conda-forge (or easier from PyPI)
tensorflow-datasets = "*"
keras-tuner = "*"
plumbum = "*"
jupyter-bokeh = "*"
qtpy = "*"
elasticsearch = "*"
gymnasium = "*"          # gym is deprecated, gymnasium is the successor
JSAnimation = "*"
dask-labextension = "*"
atlasify = "*"
jupyter-mcp-server = ">=1.0.0"

[feature.mlgpu.system-requirements]
cuda = "13.0"

[feature.mlcpu.dependencies]
tensorflow = "*"

[feature.mlgpu.dependencies]
tensorflow-gpu = "*"

[feature.dev.dependencies]
python = "==3.11"
tbump = "*"

[feature.dev.tasks]
tbump = { cmd = "tbump", description = "Run tbump" }
bump = { cmd = "tbump $(date +\"%Y.%-m.%-d\")", description = "Run tbump with current date" }

[environments]
dev = ["dev"]
mlcpu = ["mlbase", "mlcpu"]
ml = ["mlbase", "mlgpu"]
